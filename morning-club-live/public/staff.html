<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Morning Club Staff</title><link rel="stylesheet" href="/styles.css"></head><body><main class="wrap"><div class="topbar"><div><div class="brand">dipndip</div><div class="subbrand">Morning Club · Staff</div></div><button id="logoutBtn" class="light hidden" onclick="logout()">خروج</button></div><section id="loginBox" class="card"><h2>دخول الموظف</h2><div class="grid"><div><label>البريد</label><input id="email" type="email"></div><div><label>كلمة المرور</label><input id="password" type="password"></div><button onclick="login()">دخول</button><div id="loginMsg" class="alert"></div></div></section><section id="staffBox" class="hidden"><div class="card"><div class="g2 grid"><div><label>الفرع</label><select id="branch"><option value="tripoli-hayalandalus">طرابلس · حي الأندلس</option><option value="misrata">مصراتة</option></select></div><div><label>رقم الفاتورة (اختياري)</label><input id="receipt"></div></div><div style="margin-top:14px"><label>امسح QR أو أدخل رقم العضوية</label><input id="code" class="scanbox" placeholder="MC... أو MC:token"></div><button style="margin-top:12px;width:100%" onclick="lookup()">تحقق من العضوية</button></div><section id="memberBox" class="card hidden"><div class="row" style="justify-content:space-between"><div><div id="memberName" style="font-size:24px;font-weight:900"></div><div id="memberNumber" class="muted"></div></div><span id="statusPill" class="pill"></span></div><div class="divider"></div><div class="g2 grid"><div class="metric"><span class="muted">TODAY</span><b id="today"></b></div><div class="metric"><span class="muted">VALID UNTIL</span><b id="until" style="font-size:18px"></b></div></div><div id="opMsg" class="alert"></div><div style="margin-top:14px"><label>قيمة المشتريات الإضافية مع الزيارة (لتحليل Food Attach)</label><input id="spend" type="number" min="0" step=".5" value="0"></div><div class="row" style="margin-top:14px"><button class="ok" onclick="redeem()">صرف قهوة اليوم</button><button class="light" onclick="activate()">تفعيل 99 د.ل / 30 يومًا</button><button class="light" onclick="renew()">تجديد 30 يومًا</button></div></section></section></main><script>var current=null;async function api(u,o){var r=await fetch(u,o);var d=await r.json().catch(function(){return{}});if(!r.ok)throw Object.assign(new Error(d.message||d.error||'خطأ'),{data:d});return d}async function check(){try{await api('/api/auth/me');loginBox.classList.add('hidden');staffBox.classList.remove('hidden');logoutBtn.classList.remove('hidden')}catch(e){}}async function login(){try{await api('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});location.reload()}catch(e){loginMsg.textContent='بيانات الدخول غير صحيحة';loginMsg.className='alert bad'}}async function logout(){await fetch('/api/auth/logout',{method:'POST'});location.reload()}function show(d){current=d.token;memberBox.classList.remove('hidden');memberName.textContent=d.name;memberNumber.textContent=d.membershipNumber;statusPill.textContent=d.status.toUpperCase();statusPill.className='pill '+d.status;today.textContent=d.redeemedToday?'USED':(d.availableToday?'AVAILABLE':(d.inMorningWindow?'NOT ACTIVE':'OUTSIDE 8–10'));until.textContent=d.endsAt?new Date(d.endsAt).toLocaleDateString('en-GB'):'Pending';opMsg.className='alert'}async function lookup(){try{show(await api('/api/staff/find/'+encodeURIComponent(code.value.trim())))}catch(e){alert('لم يتم العثور على العضوية')}}async function post(url,body){try{var d=await api(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});opMsg.textContent='تمت العملية بنجاح';opMsg.className='alert ok';if(d.membership)show(d.membership);else await lookup()}catch(e){opMsg.textContent=e.message;opMsg.className='alert bad'}}function common(){return{code:current||code.value.trim(),branchCode:branch.value,receiptNumber:receipt.value.trim()}}function activate(){post('/api/staff/activate',Object.assign(common(),{paymentMethod:'cash'}))}function renew(){post('/api/staff/renew',Object.assign(common(),{paymentMethod:'cash'}))}function redeem(){post('/api/staff/redeem',Object.assign(common(),{spendAmount:Number(spend.value||0)}))}check();</script></body></html>
