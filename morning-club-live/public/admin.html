<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Morning Club Admin</title><link rel="stylesheet" href="/styles.css"></head><body><main class="wrap"><div class="topbar"><div><div class="brand">dipndip</div><div class="subbrand">Morning Club · Dashboard</div></div><div class="row"><a class="btn light" href="/staff">شاشة الكاشير</a><button id="logoutBtn" class="light hidden" onclick="logout()">خروج</button></div></div><section id="loginBox" class="card"><h2>دخول الإدارة</h2><div class="g2 grid"><div><label>البريد</label><input id="email" type="email"></div><div><label>كلمة المرور</label><input id="password" type="password"></div></div><button style="margin-top:14px" onclick="login()">دخول</button><div id="loginMsg" class="alert"></div></section><section id="appBox" class="hidden"><div class="g4 grid"><div class="metric"><span class="muted">الأعضاء الفعالون</span><b id="active">0</b></div><div class="metric"><span class="muted">استخدامات اليوم</span><b id="todayRed">0</b></div><div class="metric"><span class="muted">إيراد الاشتراكات 30 يوم</span><b id="revenue">0</b></div><div class="metric"><span class="muted">Food Attach Rate</span><b id="attach">0%</b></div></div><div class="g2 grid" style="margin-top:14px"><div class="metric"><span class="muted">مشتريات إضافية 30 يوم</span><b id="extra">0</b></div><div class="metric"><span class="muted">عمليات التجديد/التفعيل 30 يوم</span><b id="payments">0</b></div></div><section class="card"><div class="row" style="justify-content:space-between"><div><h2 style="margin:0">الأعضاء</h2><div class="small muted">البيانات التشغيلية للـ Morning Club</div></div><a class="btn light" href="/api/admin/export.csv">CSV</a></div><div class="row" style="margin:14px 0"><input id="search" placeholder="ابحث بالاسم أو الهاتف أو رقم العضوية" style="flex:1;min-width:230px"><button onclick="members()">بحث</button></div><div style="overflow:auto"><table><thead><tr><th>العضو</th><th>الهاتف</th><th>الحالة</th><th>الصلاحية</th><th>الاستخدامات</th><th>إنفاق إضافي</th></tr></thead><tbody id="tbody"></tbody></table></div></section></section></main><script>async function api(u,o){var r=await fetch(u,o);var d=await r.json().catch(function(){return{}});if(!r.ok)throw new Error(d.error||'خطأ');return d}async function check(){try{await api('/api/auth/me');loginBox.classList.add('hidden');appBox.classList.remove('hidden');logoutBtn.classList.remove('hidden');await refresh()}catch(e){}}async function login(){try{await api('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});location.reload()}catch(e){loginMsg.textContent='بيانات الدخول غير صحيحة';loginMsg.className='alert bad'}}async function logout(){await fetch('/api/auth/logout',{method:'POST'});location.reload()}async function refresh(){var d=await api('/api/admin/dashboard');active.textContent=d.members.active;todayRed.textContent=d.redemptions.today;revenue.textContent=d.revenue30d.toLocaleString()+' د.ل';attach.textContent=d.foodAttachRate30d+'%';extra.textContent=d.additionalSpend30d.toLocaleString()+' د.ل';payments.textContent=d.payments30d;await members()}async function members(){var arr=await api('/api/admin/members?search='+encodeURIComponent(search.value||''));tbody.innerHTML=arr.map(function(x){var st=x.status==='active'&&x.ends_at&&new Date(x.ends_at)<new Date()?'expired':x.status;return '<tr><td><b>'+esc(x.first_name+' '+x.last_name)+'</b><br><span class="small muted">'+esc(x.membership_number)+'</span></td><td>'+esc(x.phone)+'</td><td><span class="pill '+st+'">'+st+'</span></td><td>'+(x.ends_at?new Date(x.ends_at).toLocaleDateString('en-GB'):'—')+'</td><td>'+x.redemptions+'</td><td>'+Number(x.additional_spend||0).toLocaleString()+' د.ل</td></tr>'}).join('')||'<tr><td colspan="6" class="muted">لا توجد نتائج</td></tr>'}function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}check();</script></body></html>
