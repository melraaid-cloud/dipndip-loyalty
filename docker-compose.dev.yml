services:
  postgres:
    image: postgres:16-alpine
    container_name: dipndip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dipndip_loyalty
      POSTGRES_USER: dipndip
      POSTGRES_PASSWORD: dipndip123
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dipndip"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dipndip-redis
    restart: unless-stopped
    command: redis-server --requirepass dipndip123 --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "dipndip123", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: node:20-alpine
    container_name: dipndip-backend
    working_dir: /app
    command: sh -c "npm install --legacy-peer-deps && npm run start:dev"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: dipndip
      DB_PASSWORD: dipndip123
      DB_NAME: dipndip_loyalty
      DB_SSL: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: dipndip123
      REDIS_TLS: "false"
      JWT_SECRET: dipndip-jwt-secret-dev-2024-super-long-secret-key
      JWT_REFRESH_SECRET: dipndip-refresh-secret-dev-2024-super-long-refresh-key
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      SETUP_KEY: dipndip-setup-2024
      THROTTLE_TTL: "60"
      THROTTLE_LIMIT: "200"
      ENCRYPTION_KEY: dipndip-encryption-key-32-chars!!
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: node:20-slim
    container_name: dipndip-frontend
    working_dir: /app
    command: sh -c "npm install --legacy-peer-deps -q && node node_modules/next/dist/bin/next dev -p 3001"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_API_URL: http://dipndip-backend:3000/api/v1
    depends_on:
      - backend

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dipndip-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@dipndip.ly
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
  backend_node_modules:
    driver: local
  frontend_node_modules:
    driver: local
